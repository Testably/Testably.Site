name: Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'Docs/pages/**'
      - 'Pipeline/Build.Pages.cs'
      - 'Pipeline/Build.Benchmarks.cs'
      - 'Pipeline/Build.MockolateBenchmarks.cs'
      - '.github/workflows/pages.yml'
  repository_dispatch:
    types: [ extension-documentation-updated-event ]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-pages:
    name: Build Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.3xx
      - name: Aggregate documentation from sibling repositories
        run: ./build.sh Pages
        env:
          GithubToken: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./Docs/pages/package-lock.json
      - name: Install dependencies
        working-directory: ./Docs/pages
        run: npm ci --ignore-scripts
      - name: Build website
        working-directory: ./Docs/pages
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./Docs/pages/build

  deploy-pages:
    name: Deploy Pages
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
