version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "23:00"
      timezone: "Europe/Vienna"
    commit-message:
      prefix: chore

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "23:00"
      timezone: "Europe/Vienna"
    commit-message:
      prefix: chore
    groups:
      fallout:
        patterns:
          - "Fallout*"
      xunit:
        patterns:
          - "xunit*"

  - package-ecosystem: "npm"
    directory: "/Docs/pages"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "23:00"
      timezone: "Europe/Vienna"
    commit-message:
      prefix: chore
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
